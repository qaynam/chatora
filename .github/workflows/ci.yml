name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The server runs on node, not bun, so CI has to prove it works there.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The smoke test and the E2E both drive a headless Neovim; >= 0.11 is required.
      - name: Install Neovim
        run: |
          curl -fsSLO https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # ImageMagick backs the SVG, GIF and border paths. Ubuntu ships version 6, whose
      # binary is `convert`; both it and 7's `magick` are handled.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - run: bun install --frozen-lockfile

      - run: nvim --version | head -1

      - run: bun run verify
