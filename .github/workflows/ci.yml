name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Typecheck, build and lint: what has to hold before the code is even run. The tests are
# a workflow of their own (test.yml), so a PR shows the two verdicts apart.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run build
      - run: bun run check
