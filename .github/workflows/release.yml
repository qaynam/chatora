name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` stamps the build; without tags it would ship as a bare sha.
          fetch-tags: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun test` includes a test that runs the Lua side in a headless Neovim
      # (tests/uri-parity.test.ts); without one the run errors before the build.
      - name: Install Neovim
        run: |
          curl -fsSLO https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun test

      - run: bun run build

      - name: Checksum
        working-directory: packages/server/dist
        run: sha256sum main.js > main.js.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            packages/server/dist/main.js \
            packages/server/dist/main.js.sha256 --clobber
