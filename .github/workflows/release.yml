name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` stamps the build; without tags it would ship as a bare sha.
          fetch-tags: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The tests live in Test (test.yml) and the typecheck, build and lint in CI (ci.yml);
      # both run on every push to main and every PR, with the tools they need. A release
      # only builds, and refuses a commit they have not passed on rather than shipping it.
      # A tag pushed right after a merge may find those runs still going, so this waits.
      - name: Require green Test and CI runs on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          await_green() {
            for _ in $(seq 1 40); do
              state=$(gh run list --workflow "$1" --commit "$GITHUB_SHA" --limit 1 \
                --json status,conclusion --jq 'first // {} | "\(.status)/\(.conclusion)"')
              case "$state" in
                completed/success) return 0 ;;
                completed/*) echo "::error::$1 failed on $GITHUB_SHA ($state)"; return 1 ;;
                null/null) echo "::error::$1 never ran on $GITHUB_SHA"; return 1 ;;
              esac
              sleep 30
            done
            echo "::error::$1 is still running on $GITHUB_SHA"; return 1
          }
          await_green test.yml && await_green ci.yml

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Checksum
        working-directory: packages/server/dist
        run: sha256sum main.js > main.js.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            packages/server/dist/main.js \
            packages/server/dist/main.js.sha256 --clobber
