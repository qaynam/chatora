name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` stamps the build; without tags it would ship as a bare sha.
          fetch-tags: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The tests live in CI (ci.yml), which runs on every push to main and every PR, on
      # Linux and macOS with the Neovim and ImageMagick they need. A release only builds,
      # and refuses a commit CI has not passed on rather than shipping it. A tag pushed
      # right after a merge may find that run still going, so this waits for it.
      - name: Require a green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 40); do
            state=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion --jq 'first // {} | "\(.status)/\(.conclusion)"')
            case "$state" in
              completed/success) exit 0 ;;
              completed/*) echo "::error::CI failed on $GITHUB_SHA ($state)"; exit 1 ;;
              null/null) echo "::error::CI never ran on $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI is still running on $GITHUB_SHA"; exit 1

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Checksum
        working-directory: packages/server/dist
        run: sha256sum main.js > main.js.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            packages/server/dist/main.js \
            packages/server/dist/main.js.sha256 --clobber
