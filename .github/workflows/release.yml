name: Release

# A tag is the trigger, so the author decides when a release happens. What the tag gets is
# the built server: `scripts/install-server.sh` downloads it instead of building, which is
# what keeps an install from depending on the reader's toolchain.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Never publish an asset from a tree that does not pass. The Neovim half is covered by
      # the CI workflow on main; this is the half that ends up in the file.
      - run: bun run typecheck
      - run: bun test

      - run: bun run build

      - name: Checksum
        working-directory: packages/server/dist
        run: sha256sum main.js > main.js.sha256

      # The tag may be pushed before or after the release is written; either order works.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" \
            packages/server/dist/main.js \
            packages/server/dist/main.js.sha256 --clobber
